<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patagonia · December 2026: the interactive dossier</title>
  <script type="module" crossorigin src="./assets/index-C0b344-b.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DCrGbqu6.css">
</head>
<body class="world-ink">

<nav id="rail" aria-label="Parts">
  <div class="rail-line"><div class="rail-progress"></div></div>
  <ol class="rail-parts"></ol>
</nav>

<!-- Phone navigation: the rail is hidden below 900px, this takes over -->
<button id="burger" type="button" aria-label="Sections" aria-expanded="false" aria-controls="burger-menu">
  <span></span><span></span><span></span>
</button>
<nav id="burger-menu" aria-label="Sections" hidden>
  <ol class="burger-parts"></ol>
</nav>

<div class="motion-note" id="motion-note" hidden>Reduced motion is on. Everything is shown, nothing moves.</div>

<main id="story">

  <!-- ════════ COVER ════════ -->
  <section id="cover" class="scene ink" data-world="ink">
    <canvas id="sky" class="fill-canvas" aria-hidden="true"></canvas>
    <div class="cover-inner">
      <h1 id="cover-title" aria-label="Patagonia">Patagonia</h1>
      <p class="cover-dates" id="cover-dates"></p>
      <p class="subtitle" id="cover-subtitle"></p>
      <div class="cover-mark">
        <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" aria-label="The W trek route mark">
          <polyline id="cover-w" points="10,60 70,170 135,75 200,170 265,65 330,50"
                    fill="none" stroke="#C99B3F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <g id="cover-w-dots"></g>
          <g id="cover-w-labels" class="w-labels"></g>
        </svg>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span>Scroll</span><i></i></div>
    </div>
  </section>

  <!-- ════════ PART ONE · GLOBE ════════ -->
  <section id="globe" class="scene ink pinned" data-world="ink">
    <canvas id="globe-canvas" class="fill-canvas" aria-label="Globe showing the flight from London to Santiago"></canvas>
    <div class="pin-stage">
      <div class="stage-media" id="globe-anchor">
        <div class="globe-hud">
          <div class="hud-num"><span id="hud-hrs">0.0</span><small> hrs</small></div>
          <div class="hud-sub">in the air</div>
        </div>
      </div>
      <div class="stage-copy" id="globe-steps"></div>
    </div>
  </section>

  <!-- ════════ PART ONE · CHILE (full-bleed camera map) ════════ -->
  <section id="chile" class="scene ink pinned" data-world="ink">
    <div class="chile-stage" id="chile-stage">
      <div id="chile-map-wrap"></div>
      <div class="chile-overlay" id="chile-steps"></div>
      <div class="map-modal-backdrop" id="chile-modal-backdrop" hidden>
        <div class="map-modal" role="dialog" aria-modal="true" id="chile-modal">
          <button class="modal-close" id="chile-modal-close" aria-label="Close">×</button>
          <div class="modal-kicker" id="modal-kicker"></div>
          <h3 id="modal-title"></h3>
          <p id="modal-body"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ════════ PART ONE · FOUR LEGS ════════ -->
  <section id="legs" class="scene paper" data-world="paper">
    <div class="measure">
      <h2 id="legs-heading"></h2>
      <div class="route-legs" id="legs-cards"></div>
    </div>
  </section>

  <!-- ════════ SANTIAGO · THE CITY ════════ -->
  <section id="santiago" class="scene cityworld" data-world="city">
    <div class="measure">
      <h2 id="santiago-heading"></h2>
      <p class="lede" id="santiago-lede"></p>
      <div class="city-map-wrap" id="city-map-wrap"></div>
      <div class="city-legend legend" id="city-legend"></div>
      <p class="city-hint" id="city-hint"></p>
    </div>
  </section>

  <!-- ════════ PART TWO · THE W ════════ -->
  <section id="trek" class="scene iceworld pinned" data-world="ice">
    <canvas id="wind" class="fill-canvas" aria-hidden="true"></canvas>
    <div class="pin-stage trek-stage">
      <div class="trek-head">
        <h2 id="trek-heading"></h2>
      </div>
      <div class="trek-map" id="trek-map-wrap"></div>
      <div class="trek-daycard" id="trek-daycard" aria-live="polite"></div>
    </div>
  </section>

  <!-- ════════ THE TURN · ICE → CLARET ════════ -->
  <section id="turn" class="scene turnworld pinned" data-world="turn">
    <div class="pin-stage turn-stage">
      <div class="turn-copy">
        <p class="turn-line" id="turn-line-a">Five days of granite and ice.</p>
        <p class="turn-line" id="turn-line-b">Then a valley that smells of summer.</p>
      </div>
      <div class="turn-mark">
        <svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" aria-label="The trek route becoming a wine glass">
          <path id="morph-w" d="M 35,70 L 95,180 L 160,85 L 225,180 L 290,75 L 355,60"
                fill="none" stroke="#C99B3F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
          <g id="turn-dots"></g>
        </svg>
      </div>
    </div>
  </section>

  <!-- ════════ PART THREE · WINE ════════ -->
  <section id="wine" class="scene claret" data-world="claret">
    <canvas id="heat" class="fill-canvas" aria-hidden="true"></canvas>
    <div class="measure">
      <h2 id="wine-heading"></h2>
      <p class="lede" id="wine-lede"></p>
      <div class="wine-weather" id="wine-weather" aria-label="Typical December weather in Colchagua"></div>
      <div class="wine-map-wrap" id="wine-map-wrap"></div>
      <div class="wine-legend legend" id="wine-legend"></div>

      <h3 class="strip-title" id="stays-title"></h3>
      <div class="cava-feature" id="cava-feature"></div>

      <p class="wine-note" id="wine-note"></p>
    </div>
  </section>

  <!-- ════════ PART FOUR · MONEY ════════ -->
  <section id="budget" class="scene paper" data-world="paper">
    <div class="measure">
      <h2 id="budget-heading"></h2>
      <p class="lede" id="budget-lede"></p>
      <div id="budget-summary"></div>
      <div id="pay-status"></div>
    </div>
  </section>

  <!-- ════════ PART FIVE · DECISIONS ════════ -->
  <section id="decide" class="scene ink" data-world="ink">
    <div class="measure">
      <h2 id="q-heading"></h2>
      <ul class="checklist checklist-big" id="q-big"></ul>
      <div class="check-groups" id="q-groups"></div>
    </div>
  </section>


</main>

</body>
</html>
